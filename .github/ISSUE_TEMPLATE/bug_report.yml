name: Bug report
description: Report a reproducible SSAP3 problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        SSAP3 reports are redacted by default. Still review them, and remove anything personal, before attaching logs. Report security issues privately (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: SSAP3 version
      placeholder: 0.5.0-dev (commit hash)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 25H2, build 26200
    validations:
      required: true
  - type: input
    id: airpods
    attributes:
      label: AirPods model
      placeholder: AirPods Pro 3 (firmware version if known)
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Bluetooth adapter
      placeholder: TP-Link Bluetooth 5.4 USB Adapter
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact mode, audio endpoint, and application involved.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect AirPods
        2. Open SSAP3
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste relevant install or diagnostic lines after removing device addresses and private data.
      render: text
