name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build application
        run: dotnet build .\src\SSAP3.App\SSAP3.App.csproj -c Release

      - name: Run managed smoke tests
        run: >-
          dotnet run
          --project .\tests\SSAP3.Core.SmokeTests\SSAP3.Core.SmokeTests.csproj
          -c Release

      - name: Build spatializer
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\audio\build-spatializer.ps1

      - name: Test spatializer
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\audio\test-spatializer.ps1

      - name: Rebuild icons
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\assets\build-icons.ps1

      - name: Validate generated icons
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $pngPath = '.\assets\ssap3-mark.png'
          $icoPath = '.\assets\SSAP3.ico'
          $png = [System.Drawing.Image]::FromFile($pngPath)
          try {
            if ($png.Width -ne 512 -or $png.Height -ne 512) {
              throw "Unexpected PNG dimensions: $($png.Width)x$($png.Height)"
            }
          }
          finally {
            $png.Dispose()
          }
          $icon = New-Object System.Drawing.Icon($icoPath)
          try {
            if ($icon.Width -lt 16 -or $icon.Height -lt 16) {
              throw "The generated ICO has no usable image."
            }
          }
          finally {
            $icon.Dispose()
          }
